<!doctype html>
<html lang="en">
  <head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta charset="UTF-8" />
    
    <!-- viewport-fit=cover: draw under the iPhone notch/home bar (safe-area
         insets pad the card bar back out). user-scalable=no: pinch belongs to
         the office canvas zoom, not page zoom. interactive-widget: Android
         resizes the layout when the keyboard opens, so xterm re-fits. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- The standalone page URL carries the server token (?token=); never send it as a Referer. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#1e1e2e" />
    
    <!-- iOS "Add to Home Screen": standalone chrome-less launch -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pixel Agents" />
    
    <!-- public/ also holds favicon.ico, apple-touch-icon.png and
         apple-touch-icon-precomposed.png at their conventional paths: browsers
         and iOS probe those without a <link>, and the standalone server's SPA
         fallback would otherwise answer the probe with index.html, leaving a
         stale cached icon in place forever. Bump ?v= on every icon change. -->
    <title>Pixel Agents</title>
    <script type="module" crossorigin src="/vendor/pixel-agents/office/assets/index-D_2MvNHK.js"></script>
    <link rel="stylesheet" crossorigin href="/vendor/pixel-agents/office/assets/index-JILe5P55.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
