services:
  report-db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ./.runtime/report-db.env
    ports: ["127.0.0.1:55435:5432"]
    volumes: ["sandbox-reports:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantara_reports -d quantara_reports"]
      interval: 3s
      timeout: 3s
      retries: 15
  web:
    image: quantara-web:latest
    build:
      context: ./apps/trading-company-web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_PIXEL_OFFICE_URL: http://localhost:4242
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
  pixel-office:
    image: quantara-pixel-office:latest
    build: { context: ./integrations/pixel-agents }
    restart: unless-stopped
    ports: ["127.0.0.1:4242:4242"]
    environment:
      QUANTARA_SIGNALR_URL: http://host.docker.internal:8080/realtime/trading
volumes:
  sandbox-reports:
