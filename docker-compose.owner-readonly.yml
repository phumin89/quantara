services:
  owner:
    build: { context: ./src, dockerfile: TradingCompany.LiveExecution/Dockerfile }
    image: quantara-owner-readonly:latest
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000", "127.0.0.1:7443:7443"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      OwnerWeb__ProxyEnabled: 'true'
      OwnerWeb__ContainerHost: 'true'
      OwnerConsole__Enabled: 'true'
      OwnerSession__StateDirectory: /owner-state
      Bitkub__CredentialsFile: /secrets/bitkub.env
      Logging__LogLevel__Default: Warning
    volumes:
      - ./.env:/secrets/bitkub.env:ro
      - ./.runtime/owner-tls/localhost.pfx:/tls/localhost.pfx:ro
      - ./.runtime/owner-tls/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ./.runtime/live:/live-config:ro
      - owner-state:/owner-state
    networks: [owner-private]
    logging: { driver: none }
  ledger:
    profiles: [live-execution]
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [{ path: ./.runtime/live-db/database.env, required: false }]
    volumes: [live-ledger:/var/lib/postgresql/data]
    networks: [owner-private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U quantara -d quantara_live']
      interval: 5s
      timeout: 3s
      retries: 12
    logging: { driver: none }
  owner-web:
    image: quantara-web:latest
    build: { context: ., dockerfile: apps/trading-company-web/Dockerfile.live }
    restart: unless-stopped
    environment: { PORT: '3001', HOSTNAME: 0.0.0.0 }
    command: [npm, start, --, --hostname, 0.0.0.0, --port, '3001']
    networks: [owner-private]
  company:
    profiles: [live-company]
    build: { context: ./src, dockerfile: TradingCompany.Api/Dockerfile.sandbox }
    image: quantara-live-company:latest
    command: [--live-company]
    restart: unless-stopped
    environment:
      QUANTARA_LIVE_COMPANY_CONFIG: /company-config/advisory.json
      Logging__LogLevel__Default: Warning
    volumes:
      - ./.runtime/live-company/advisory.json:/company-config/advisory.json:ro
      - ./.runtime/owner-tls/localhost.cer:/trust/localhost.cer:ro
      - ${QUANTARA_CODEX_AUTH_FILE:-./.runtime/live-company/missing-auth.json}:/root/.codex/auth.json:ro
      - company-data:/company-data
    networks: [owner-private]
    logging: { driver: none }
networks:
  owner-private:
volumes:
  owner-state:
  company-data:
  live-ledger:
